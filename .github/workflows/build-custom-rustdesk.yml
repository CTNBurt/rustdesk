name: Build Custom RustDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject server and key
        shell: pwsh
        run: |
          $server = "${{ secrets.RENDEZVOUS_SERVER }}"
          $pubKey = "${{ secrets.RS_PUB_KEY }}"
          Get-ChildItem -Path src -Filter "*.rs" -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'RENDEZVOUS_SERVERS') {
              $content = $content -replace 'const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*?\];', "const RENDEZVOUS_SERVERS: &[&str] = &[\"$server\"];"
            }
            if ($content -match 'RS_PUB_KEY') {
              $content = $content -replace 'pub const RS_PUB_KEY: &str = ".*?";', "pub const RS_PUB_KEY: &str = \"$pubKey\";"
            }
            Set-Content -Path $_.FullName -Value $content -NoNewline
          }
      - name: Build Windows release binary
        shell: pwsh
        run: |
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: target/release/rustdesk.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject server and key
        run: |
          python3 - <<'EOF'
          import os, re
          server = os.environ["RENDEZVOUS_SERVER"]
          pub_key = os.environ["RS_PUB_KEY"]
          for root, _, files in os.walk("src"):
              for fn in files:
                  if not fn.endswith(".rs"):
                      continue
                  fp = os.path.join(root, fn)
                  with open(fp, "r", encoding="utf-8") as f:
                      txt = f.read()
                  new_txt = re.sub(
                      r'const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*?\];',
                      f'const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];',
                      txt,
                      flags=re.S,
                  )
                  new_txt = re.sub(
                      r'pub const RS_PUB_KEY: &str = ".*?";',
                      f'pub const RS_PUB_KEY: &str = "{pub_key}";',
                      new_txt,
                      flags=re.S,
                  )
                  if new_txt != txt:
                      with open(fp, "w", encoding="utf-8") as f:
                          f.write(new_txt)
          EOF
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
      - name: Build macOS release binary and DMG
        run: |
          cargo build --release
          hdiutil create -volname "RustDesk-Custom" -srcfolder target/release -ov -format UDZO RustDesk-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos-dmg
          path: RustDesk-macOS.dmg
