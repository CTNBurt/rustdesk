name: Build Custom RustDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject server and key
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          $server = $env:RENDEZVOUS_SERVER.Trim()
          $pubKey = $env:RS_PUB_KEY.Trim()
          if ([string]::IsNullOrWhiteSpace($server) -or [string]::IsNullOrWhiteSpace($pubKey)) {
            throw "Missing RENDEZVOUS_SERVER or RS_PUB_KEY secret."
          }

          $files = Get-ChildItem -Filter "*.rs" -Recurse | Where-Object { $_.FullName -notmatch '\\target\\' }
          $replacedServer = $false
          $replacedKey = $false

          foreach ($f in $files) {
            $raw = Get-Content $f.FullName -Raw
            $updated = $raw

            if ($updated -match 'RENDEZVOUS_SERVERS\s*(?::[^=]+)?\s*=') {
              $updated = [regex]::Replace(
                $updated,
                '(?s)(RENDEZVOUS_SERVERS\s*(?::[^=]+)?\s*=\s*&\[)[^\]]*(\]\s*;)',
                "`${1}`"$server`"`${2}"
              )
              if ($updated -ne $raw) {
                $replacedServer = $true
                Write-Host "Updated RENDEZVOUS_SERVERS in $($f.FullName)"
              }
            }

            if ($updated -match 'RS_PUB_KEY\s*(?::[^=]+)?\s*=') {
              $updated = [regex]::Replace(
                $updated,
                '(?s)(RS_PUB_KEY\s*(?::[^=]+)?\s*=\s*)"[^"]*"',
                "`${1}`"$pubKey`""
              )
              if ($updated -ne $raw) {
                $replacedKey = $true
                Write-Host "Updated RS_PUB_KEY in $($f.FullName)"
              }
            }

            if ($updated -ne $raw) {
              Set-Content -Path $f.FullName -Value $updated -NoNewline
            }
          }

          if (-not $replacedServer -or -not $replacedKey) {
            throw "Failed to replace constants. replacedServer=$replacedServer replacedKey=$replacedKey"
          }

      - name: Install Windows dependencies via vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or -not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            throw "vcpkg.exe not found at $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install --triplet x64-windows-static

      - name: Build Windows release binary
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          cargo build --release --bin rustdesk

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: target/release/rustdesk.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject server and key
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re

          server = os.environ.get("RENDEZVOUS_SERVER", "").strip()
          pub_key = os.environ.get("RS_PUB_KEY", "").strip()
          assert server, "RENDEZVOUS_SERVER is empty"
          assert pub_key, "RS_PUB_KEY is empty"

          replaced_server = False
          replaced_key = False

          for fp in pathlib.Path(".").rglob("*.rs"):
              if "target" in fp.parts:
                  continue
              raw = fp.read_text(encoding="utf-8", errors="ignore")
              updated = raw

              updated, n1 = re.subn(
                  r'(?s)(RENDEZVOUS_SERVERS\s*(?::[^=]+)?\s*=\s*&\[)[^\]]*(\]\s*;)',
                  rf'\g<1>"{server}"\g<2>',
                  updated,
              )
              updated, n2 = re.subn(
                  r'(?s)(RS_PUB_KEY\s*(?::[^=]+)?\s*=\s*)"[^"]*"',
                  rf'\g<1>"{pub_key}"',
                  updated,
              )

              if n1 > 0:
                  replaced_server = True
                  print(f"Updated RENDEZVOUS_SERVERS in {fp}")
              if n2 > 0:
                  replaced_key = True
                  print(f"Updated RS_PUB_KEY in {fp}")

              if updated != raw:
                  fp.write_text(updated, encoding="utf-8")

          assert replaced_server and replaced_key, (
              f"Constant replacement failed: replaced_server={replaced_server}, replaced_key={replaced_key}"
          )
          EOF

      - name: Install macOS dependencies via vcpkg
        run: |
          brew install nasm cmake ninja pkg-config
          git clone --depth 1 https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$HOME/vcpkg/vcpkg" install
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build macOS release binary and DMG
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          cargo build --release --bin rustdesk
          mkdir -p /tmp/rustdesk-dmg
          cp target/release/rustdesk /tmp/rustdesk-dmg/
          hdiutil create -volname "RustDesk-Custom" -srcfolder /tmp/rustdesk-dmg -ov -format UDZO RustDesk-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos-dmg
          path: RustDesk-macOS.dmg
