name: Build Custom RustDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject server and key
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          $server = $env:RENDEZVOUS_SERVER.Trim()
          $pubKey = $env:RS_PUB_KEY.Trim()
          if ([string]::IsNullOrWhiteSpace($server) -or [string]::IsNullOrWhiteSpace($pubKey)) {
            throw "Missing RENDEZVOUS_SERVER or RS_PUB_KEY secret."
          }

          $q = '"'
          $files = Get-ChildItem -Filter "*.rs" -Recurse | Where-Object { $_.FullName -notmatch '\\target\\' }
          $replacedServer = $false
          $replacedKey = $false

          foreach ($f in $files) {
            $raw = Get-Content $f.FullName -Raw
            $updated = $raw

            if ($updated -match 'RENDEZVOUS_SERVERS\s*(?::[^=]+)?\s*=') {
              $updated = [regex]::Replace(
                $updated,
                '(?s)(RENDEZVOUS_SERVERS\s*(?::[^=]+)?\s*=\s*&\[)[^\]]*(\]\s*;)',
                "`${1}${q}${server}${q}`${2}"
              )
              if ($updated -ne $raw) {
                $replacedServer = $true
                Write-Host "Updated RENDEZVOUS_SERVERS in $($f.FullName)"
              }
            }

            if ($updated -match 'RS_PUB_KEY\s*(?::[^=]+)?\s*=') {
              $updated = [regex]::Replace(
                $updated,
                '(?s)(RS_PUB_KEY\s*(?::[^=]+)?\s*=\s*)"[^"]*"',
                "`${1}${q}${pubKey}${q}"
              )
              if ($updated -ne $raw) {
                $replacedKey = $true
                Write-Host "Updated RS_PUB_KEY in $($f.FullName)"
              }
            }

            if ($updated -ne $raw) {
              Set-Content -Path $f.FullName -Value $updated -NoNewline
            }
          }

          if (-not $replacedServer -or -not $replacedKey) {
            throw "Failed to replace constants. replacedServer=$replacedServer replacedKey=$replacedKey"
          }

      - name: Install Windows dependencies and configure paths
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or -not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            $vcpkgRoot = "C:\vcpkg"
          }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            throw "vcpkg.exe not found at $vcpkgRoot"
          }

          if (Test-Path "vcpkg.json") {
            $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json
            if ($null -eq $manifest.dependencies) {
              $manifest | Add-Member -MemberType NoteProperty -Name "dependencies" -Value @()
            }
            $deps = @($manifest.dependencies)
            foreach ($pkg in @("opus", "libvpx", "libyuv")) {
              $exists = $false
              foreach ($d in $deps) {
                if (($d -is [string] -and $d -eq $pkg) -or ($d.name -eq $pkg)) {
                  $exists = $true
                }
              }
              if (-not $exists) {
                $deps += $pkg
                Write-Host "Added '$pkg' to vcpkg.json"
              }
            }
            $manifest.dependencies = $deps
            $manifest | ConvertTo-Json -Depth 10 | Set-Content "vcpkg.json" -Encoding utf8
          }

          & "$vcpkgRoot\vcpkg.exe" install --triplet x64-windows-static

          $searchRoots = @("$PWD\vcpkg_installed", "$vcpkgRoot\installed") | Where-Object { Test-Path $_ }
          $vp8 = Get-ChildItem -Path $searchRoots -Filter "vp8.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $vp8) {
            throw "vp8.h not found anywhere under workspace or $vcpkgRoot"
          }
          $vpxIncRoot = Split-Path (Split-Path $vp8.FullName -Parent) -Parent
          Write-Host "Found vpx include root: $vpxIncRoot"

          $incDirs = @(
            $vpxIncRoot,
            "$PWD\vcpkg_installed\x64-windows-static\include",
            "$vcpkgRoot\installed\x64-windows-static\include"
          ) | Where-Object { Test-Path $_ } | Select-Object -Unique

          $libFiles = Get-ChildItem -Path $searchRoots -Filter "*.lib" -Recurse -ErrorAction SilentlyContinue
          Write-Host "=== Matching opus/vpx/yuv libs ==="
          $libFiles | Where-Object { $_.Name -match "opus|vpx|yuv" } | ForEach-Object { Write-Host $_.FullName }
          $libDirs = @($libFiles | ForEach-Object { $_.DirectoryName } | Select-Object -Unique)

          $clangArgs = ($incDirs | ForEach-Object { "-I$_" }) -join " "
          $nativeFlags = ($libDirs | ForEach-Object { "-L", "native=$_" })
          $rustFlagsList = @("-C", "target-feature=+crt-static") + $nativeFlags
          $rustFlagsToml = ($rustFlagsList | ForEach-Object { "`"$($_.Replace('\', '\\'))`"" }) -join ", "

          New-Item -ItemType Directory -Force -Path ".cargo" | Out-Null
          @"
          [env]
          VCPKG_ROOT = "$($vcpkgRoot.Replace('\', '\\'))"
          VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          BINDGEN_EXTRA_CLANG_ARGS = "$($clangArgs.Replace('\', '\\'))"
          BINDGEN_EXTRA_CLANG_ARGS_x86_64-pc-windows-msvc = "$($clangArgs.Replace('\', '\\'))"

          [build]
          rustflags = [$rustFlagsToml]
          "@ | Set-Content ".cargo\config.toml" -Encoding utf8

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64-pc-windows-msvc=$clangArgs" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows release binary
        shell: pwsh
        run: |
          cargo build --release --bin rustdesk

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: target/release/rustdesk.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject server and key
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re

          server = os.environ.get("RENDEZVOUS_SERVER", "").strip()
          pub_key = os.environ.get("RS_PUB_KEY", "").strip()
          assert server, "RENDEZVOUS_SERVER is empty"
          assert pub_key, "RS_PUB_KEY is empty"

          replaced_server = False
          replaced_key = False

          for fp in pathlib.Path(".").rglob("*.rs"):
              if "target" in fp.parts:
                  continue
              raw = fp.read_text(encoding="utf-8", errors="ignore")
              updated = raw

              updated, n1 = re.subn(
                  r'(?s)(RENDEZVOUS_SERVERS\s*(?::[^=]+)?=\s*&\[)[^\]]*(\]\s*;)',
                  rf'\g<1>"{server}"\g<2>',
                  updated,
              )
              updated, n2 = re.subn(
                  r'(?s)(RS_PUB_KEY\s*(?::[^=]+)?=\s*)"[^"]*"',
                  rf'\g<1>"{pub_key}"',
                  updated,
              )

              if n1 > 0:
                  replaced_server = True
                  print(f"Updated RENDEZVOUS_SERVERS in {fp}")
              if n2 > 0:
                  replaced_key = True
                  print(f"Updated RS_PUB_KEY in {fp}")

              if updated != raw:
                  fp.write_text(updated, encoding="utf-8")

          assert replaced_server and replaced_key, (
              f"Constant replacement failed: replaced_server={replaced_server}, replaced_key={replaced_key}"
          )
          EOF

      - name: Install macOS dependencies via vcpkg
        run: |
          brew install nasm cmake ninja pkg-config
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path("vcpkg.json")
          if p.exists():
              data = json.loads(p.read_text(encoding="utf-8"))
              deps = data.setdefault("dependencies", [])
              for pkg in ["opus", "libvpx", "libyuv"]:
                  if not any((d == pkg) or (isinstance(d, dict) and d.get("name") == pkg) for d in deps):
                      deps.append(pkg)
                      print(f"Added '{pkg}' to vcpkg.json")
              p.write_text(json.dumps(data, indent=2), encoding="utf-8")
          EOF
          "$HOME/vcpkg/vcpkg" install --triplet arm64-osx

          echo "=== Matching opus/vpx/yuv libs ==="
          find "$PWD/vcpkg_installed" "$HOME/vcpkg/installed" -name "*.a" 2>/dev/null | grep -E "opus|vpx|yuv" || true

          LIB_DIRS=$(find "$PWD/vcpkg_installed" "$HOME/vcpkg/installed" -name "*.a" 2>/dev/null | xargs -n1 dirname | sort -u)
          INC_DIRS=""
          for d in "$PWD/vcpkg_installed/arm64-osx/include" "$HOME/vcpkg/installed/arm64-osx/include"; do
            if [ -d "$d" ]; then
              INC_DIRS="${INC_DIRS:+$INC_DIRS:}$d"
            fi
          done

          CLANG_ARGS=""
          for d in $(echo "$INC_DIRS" | tr ':' ' '); do
            CLANG_ARGS="$CLANG_ARGS -I$d"
          done

          RUSTFLAGS_TOML=""
          for d in $LIB_DIRS; do
            RUSTFLAGS_TOML="${RUSTFLAGS_TOML:+$RUSTFLAGS_TOML, }\"-L\", \"native=$d\""
          done

          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [env]
          VCPKG_ROOT = "$HOME/vcpkg"
          VCPKG_DEFAULT_TRIPLET = "arm64-osx"
          BINDGEN_EXTRA_CLANG_ARGS = "$CLANG_ARGS"

          [build]
          rustflags = [$RUSTFLAGS_TOML]
          EOF

      - name: Build macOS release binary and DMG
        run: |
          cargo build --release --bin rustdesk
          mkdir -p /tmp/rustdesk-dmg
          cp target/release/rustdesk /tmp/rustdesk-dmg/
          hdiutil create -volname "RustDesk-Custom" -srcfolder /tmp/rustdesk-dmg -ov -format UDZO RustDesk-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos-dmg
          path: RustDesk-macOS.dmg
